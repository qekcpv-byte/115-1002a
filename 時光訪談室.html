        async function callGeminiAPI(payload, isJsonMode = false) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
            
            const requestBody = { ...payload };

            if (isJsonMode) {
                requestBody.generationConfig = {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            bio: { type: "STRING" },
                            title: { type: "STRING" },
                            avatar: { type: "STRING" },
                            achievements: { type: "ARRAY", items: { type: "STRING" } },
                            quotes: { type: "ARRAY", items: { type: "STRING" } },
                            suggestedQuestions: { type: "ARRAY", items: { type: "STRING" } },
                            tone: { type: "STRING" },
                            welcomeMessage: { type: "STRING" }
                        },
                        required: ["bio", "title", "achievements", "quotes", "suggestedQuestions", "tone", "welcomeMessage"]
                    }
                };
            }

            let retries = 0;
            const maxRetries = 3;
            
            while (retries <= maxRetries) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        throw new Error(`API Request Error: ${response.status}`);
                    }

                    const data = await response.json();
                    return data;
                } catch (error) {
                    retries++;
                    if (retries > maxRetries) throw error;
                    await new Promise(r => setTimeout(r, 1000 * Math.pow(2, retries)));
                }
            }
        }

                    setSpeakingMsgId(null);
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);

                utterance.rate = 0.95;

                utterance.onerror = () => setSpeakingMsgId(null);

生平背景：${figure.bio}

核心要求：
1. 必須完全沉浸在 ${figure.name} 的角色中，用符合該時代與性格的口吻回答。
2. 使用繁體中文回答，表達自然流暢、充滿智慧與個性。
3. 保持簡潔而有深度（約 100-250 字）。
4. 如果用戶問及現代事物（如智慧型手機、網際網路等），請以該時代人物的角度表現出好奇、困惑或獨特的哲學見解。
5. 絕對不要脫離角色，嚴禁說明自己是 AI 或語言模型。`;

                    const payload = {
                        systemInstruction: {
                            parts: [{ text: systemPrompt }]
                        },
                        contents: [
                            ...recentHistory,
                            { role: 'user', parts: [{ text: userText }] }
                        ]
                    };

                    const data = await callGeminiAPI(payload);
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    return text || "（時空風暴干擾，請再說一次...）";

                } catch (error) {
                    console.error("AI response generation error:", error);
                    return "（時空波障影響，對話訊號暫時受阻...）";
                }
            };

            // Send User Message
            const handleSendMessage = async (text) => {
                if (!text.trim() || isTyping) return;

                const newUserMsg = { id: Date.now(), sender: 'user', text: text };
                const updatedMessages = [...messages, newUserMsg];
                setMessages(updatedMessages);
                setInputValue('');
                setIsTyping(true);

                const responseText = await generateAIResponse(text, selectedFigure, updatedMessages);
                
                const newBotMsg = { id: Date.now() + 1, sender: 'bot', text: responseText };
                setMessages(prev => [...prev, newBotMsg]);
                setIsTyping(false);
            };

            if (view === 'home') {
                return (
                    <div className="min-h-screen bg-slate-950 font-sans text-slate-100 p-4 md:p-8 flex flex-col items-center justify-between">
                        {/* Header Header */}
                        <header className="mt-6 mb-10 text-center max-w-3xl">
                            <div className="inline-flex items-center justify-center bg-gradient-to-tr from-amber-600 to-amber-400 p-4 rounded-2xl text-slate-950 shadow-xl shadow-amber-500/10 mb-5">
                                <IconHistory size={40} />
                            </div>
                            <h1 className="text-4xl md:text-6xl font-extrabold mb-4 serif-title tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-100">
                                時光訪談室
                            </h1>
                            <p className="text-slate-400 text-base md:text-lg leading-relaxed max-w-2xl mx-auto">
                                穿越歲月長河，與歷代巨人深度對話。輸入任意歷史人物姓名，或選擇精選名冊，即刻展開跨越時空的對話。
                            </p>
                        </header>

                        <main className="w-full max-w-5xl space-y-10 mb-12">
                            {/* Custom Figure Input Box */}
                            <section className="bg-slate-900/80 backdrop-blur-md p-6 md:p-8 rounded-3xl border border-amber-500/20 shadow-2xl relative overflow-hidden">
                                <div className="absolute -top-24 -right-24 w-60 h-60 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

                                <h2 className="text-xl font-bold mb-4 flex items-center text-amber-300">
                                    <IconSparkles className="mr-2.5 text-amber-400" size={22} /> 
                                    召喚任意歷史人物
                                </h2>
                                <form onSubmit={handleCustomStart} className="flex flex-col sm:flex-row gap-3 relative z-10">
                                    <input
                                        type="text"
                                        placeholder="輸入你想訪談的人物 (例如：蘇格拉底、李白、亞歷山大大帝、林徽因...)"
                                        className="flex-1 px-5 py-4 bg-slate-950/80 border border-slate-700/80 rounded-2xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 focus:outline-none text-slate-100 placeholder-slate-500 text-base"
                                        value={customName}
                                        onChange={(e) => setCustomName(e.target.value)}
                                        disabled={isGeneratingProfile}
                                    />
                                    <button 
                                        type="submit"
                                        disabled={isGeneratingProfile || !customName.trim()}
                                        className={`px-8 py-4 rounded-2xl font-bold transition-all duration-300 flex items-center justify-center shadow-lg min-w-[180px] ${
                                            isGeneratingProfile || !customName.trim()
                                                ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'
                                                : 'bg-gradient-to-r from-amber-600 via-amber-500 to-amber-600 hover:from-amber-500 hover:to-amber-400 text-slate-950 shadow-amber-500/20 transform hover:-translate-y-0.5'
                                        }`}
                                    >
                                        {isGeneratingProfile ? (
                                            <>
                                                <IconLoader className="mr-2" size={20} />
                                                開啟時光通道...
                                            </>
                                        ) : (
                                            <>
                                                <IconSparkles size={18} className="mr-2" />
                                                啟動訪談
                                            </>
                                        )}
                                    </button>
                                </form>
                                <p className="mt-3 text-xs text-slate-400 flex items-center">
                                    <span className="w-1.5 h-1.5 bg-amber-400 rounded-full mr-2 animate-ping"></span>
                                    AI 將即時構建該歷史人物的生平、口吻與思想風格。
                                </p>
                            </section>

                            {/* Preset Figures Selection */}
                            <section>
                                <h2 className="text-xl font-bold mb-6 flex items-center text-slate-300">
                                    <IconUser className="mr-2.5 text-amber-400" size={22} /> 
                                    精選時空名冊
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {Object.values(PRESET_FIGURES).map((figure) => (
                                        <div 
                                            key={figure.id}
                                            onClick={() => handleSelectPreset(figure.name)}
                                            className="bg-slate-900/60 hover:bg-slate-900 border border-slate-800 hover:border-amber-500/50 cursor-pointer transition-all duration-300 transform hover:-translate-y-1.5 rounded-3xl p-6 shadow-xl flex flex-col justify-between group"
                                        >
                                            <div>
                                                <div className="flex items-center justify-between mb-4">
                                                    <span className="text-4xl p-3 bg-slate-950 rounded-2xl border border-slate-800 group-hover:scale-110 transition-transform duration-300 shadow-inner">
                                                        {figure.avatar}
                                                    </span>
                                                    <span className="text-xs font-semibold px-3 py-1 bg-amber-500/10 text-amber-400 rounded-full border border-amber-500/20">
                                                        {figure.title}
                                                    </span>
                                                </div>
                                                <h3 className="text-2xl font-bold text-slate-100 mb-2 serif-title">{figure.name}</h3>
                                                <p className="text-slate-400 text-sm line-clamp-3 leading-relaxed mb-4">
                                                    {figure.bio}
                                                </p>
                                            </div>

                                            <div className="pt-4 border-t border-slate-800/80 flex items-center justify-between text-amber-400 text-sm font-semibold group-hover:text-amber-300">
                                                <span>開啟對話</span>
                                                <span className="transform group-hover:translate-x-1 transition-transform">→</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        </main>

                        <footer className="text-center text-xs text-slate-500 pb-4">
                            時光訪談室 &copy; 由 Gemini 3 Flash 提供高擬真角色模型驅動
                        </footer>
                    </div>
                );
            }

            return (
                <div className="h-screen bg-slate-950 flex flex-col md:flex-row overflow-hidden font-sans">
                    {/* Sidebar: Historical Figure Bio & Quotes */}
                    <aside className="w-full md:w-80 lg:w-96 bg-slate-900 border-r border-slate-800 flex flex-col shadow-2xl z-20 flex-shrink-0">
                        {/* Header bar */}
                        <div className="p-5 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between">
                            <button 
                                onClick={() => {
                                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                                    setView('home');
                                }} 
                                className="text-slate-400 hover:text-slate-100 transition-colors flex items-center text-sm font-medium bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700"
                            >
                                <IconArrowLeft size={16} className="mr-1.5" /> 結束對話
                            </button>
                            <div className="flex items-center gap-2">
                                <span className="text-2xl">{selectedFigure.avatar}</span>
                                <div>
                                    <h2 className="font-bold text-base text-slate-100 serif-title">{selectedFigure.name}</h2>
                                    <p className="text-xs text-amber-400">{selectedFigure.title}</p>
                                </div>
                            </div>
                        </div>

                        {/* Profile Info Details */}
                        <div className="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
                            <section className="bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
                                <h3 className="text-amber-400 font-bold mb-2 flex items-center uppercase tracking-wider text-xs">
                                    <IconUser size={14} className="mr-2" /> 生平事蹟
                                </h3>
                                <p className="text-slate-300 leading-relaxed text-xs text-justify">
                                    {selectedFigure.bio}
                                </p>
                            </section>

                            <section className="bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
                                <h3 className="text-amber-400 font-bold mb-2.5 flex items-center uppercase tracking-wider text-xs">
                                    <IconAward size={14} className="mr-2" /> 豐功偉業
                                </h3>
                                <ul className="space-y-2">
                                    {selectedFigure.achievements.map((item, idx) => (
                                        <li key={idx} className="flex items-start text-xs text-slate-300">
                                            <span className="w-1.5 h-1.5 bg-amber-500 rounded-full mt-1.5 mr-2 flex-shrink-0"></span>
                                            <span className="leading-normal">{item}</span>
                                        </li>
                                    ))}
                                </ul>
                            </section>

                            <section className="bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
                                <h3 className="text-amber-400 font-bold mb-2.5 flex items-center uppercase tracking-wider text-xs">
                                    <IconQuote size={14} className="mr-2" /> 名言警句
                                </h3>
                                <div className="space-y-2.5">
                                    {selectedFigure.quotes.map((quote, idx) => (
                                        <blockquote key={idx} className="border-l-2 border-amber-500/50 pl-3 italic text-slate-400 text-xs leading-relaxed">
                                            "{quote}"
                                        </blockquote>
                                    ))}
                                </div>
                            </section>
                        </div>
                    </aside>

                    {/* Main Chat Area */}
                    <main className="flex-1 flex flex-col bg-slate-950 relative overflow-hidden">
                        {/* Subtle ambient light gradient background */}
                        <div className="absolute top-0 right-1/4 w-96 h-96 bg-amber-500/5 rounded-full blur-3xl pointer-events-none"></div>

                        {/* Messages Feed */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-5 custom-scrollbar relative z-10">
                            {messages.map((msg) => (
                                <div 
                                    key={msg.id} 
                                    className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}
                                >
                                    {msg.sender !== 'user' && msg.sender !== 'system' && (
                                        <div className="w-10 h-10 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-xl mr-3 shadow-md flex-shrink-0 self-start">
                                            {selectedFigure.avatar}
                                        </div>
                                    )}
                                    
                                    <div className="group relative max-w-[85%] md:max-w-[75%]">
                                        <div 
                                            className={`p-4 rounded-3xl text-sm md:text-base leading-relaxed shadow-lg ${
                                                msg.sender === 'user' 
                                                    ? 'bg-gradient-to-r from-amber-600 to-amber-500 text-slate-950 font-medium rounded-tr-none' 
                                                    : msg.sender === 'system'
                                                    ? 'bg-slate-900/80 text-amber-400 border border-amber-500/20 text-xs text-center w-full mx-auto my-3 shadow-none rounded-2xl'
                                                    : 'bg-slate-900 text-slate-100 rounded-tl-none border border-slate-800/90'
                                            }`}
                                        >
                                            {msg.text}
                                        </div>

                                        {/* Speech synthesis button for AI replies */}
                                        {msg.sender === 'bot' && (
                                            <button
                                                onClick={() => speakText(msg.text, msg.id)}
                                                title="朗讀回應"
                                                className={`mt-1.5 ml-2 p-1.5 rounded-full transition-colors text-xs inline-flex items-center gap-1 ${
                                                    speakingMsgId === msg.id 
                                                        ? 'bg-amber-500/20 text-amber-400 animate-pulse' 
                                                        : 'text-slate-500 hover:text-slate-300'
                                                }`}
                                            >
                                                <IconVolume size={14} />
                                                {speakingMsgId === msg.id ? "朗讀中..." : ""}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ))}
                            
                            {/* Typing Animation */}
                            {isTyping && (
                                <div className="flex justify-start items-center">
                                    <div className="w-10 h-10 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-xl mr-3 flex-shrink-0">
                                        {selectedFigure.avatar}
                                    </div>
                                    <div className="bg-slate-900 p-4 rounded-3xl rounded-tl-none border border-slate-800 shadow-md flex items-center gap-1.5">
                                        <span className="w-2 h-2 bg-amber-400 rounded-full animate-bounce"></span>
                                        <span className="w-2 h-2 bg-amber-400 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></span>
                                        <span className="w-2 h-2 bg-amber-400 rounded-full animate-bounce" style={{animationDelay: '0.4s'}}></span>
                                    </div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        {/* Bottom Question Prompt Suggestions & Input Field */}
                        <div className="bg-slate-900/90 border-t border-slate-800/80 p-4 relative z-10 backdrop-blur-md">
                            {/* Suggested Questions Slider */}
                            <div className="mb-3 overflow-x-auto flex gap-2 pb-2 custom-scrollbar">
                                <div className="flex items-center text-xs font-bold text-amber-400 whitespace-nowrap px-1">
                                    <IconSparkles size={14} className="mr-1" /> 建議提問:
                                </div>
                                {selectedFigure.suggestedQuestions.map((q, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => handleSendMessage(q)}
                                        className="whitespace-nowrap px-3.5 py-1.5 rounded-full bg-slate-950 hover:bg-slate-800 text-slate-300 hover:text-amber-300 text-xs border border-slate-800 hover:border-amber-500/30 transition-all duration-200"
                                    >
                                        {q}
                                    </button>
                                ))}
                            </div>

                            {/* Message Input Form */}
                            <div className="flex gap-2 items-center max-w-4xl mx-auto">
                                <input
                                    type="text"
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && handleSendMessage(inputValue)}
                                    placeholder={`與 ${selectedFigure.name} 跨時空對話...`}
                                    className="flex-1 px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-2xl focus:ring-2 focus:ring-amber-500 focus:outline-none text-slate-100 placeholder-slate-500 text-sm md:text-base transition-all"
                                />
                                <button
                                    onClick={() => handleSendMessage(inputValue)}
                                    disabled={!inputValue.trim() || isTyping}
                                    className={`p-3.5 rounded-2xl flex items-center justify-center transition-all shadow-lg ${
                                        !inputValue.trim() || isTyping
                                            ? 'bg-slate-800 text-slate-600 cursor-not-allowed'
                                            : 'bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold active:scale-95'
                                    }`}
                                >
                                    <IconSend size={20} />
                                </button>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HistoryChatApp />);
    </script>
</body>
</html>
